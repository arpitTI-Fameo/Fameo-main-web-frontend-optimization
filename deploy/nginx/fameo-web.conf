# nginx site for fameo-web (Next.js) on the shared production EC2 host.
#   /etc/nginx/conf.d/fameo-web.conf   (replace fameo.example.com)
#
# Internet → 80/443 (nginx, TLS) → 127.0.0.1:3000 (the container; never public).
# The API has its own site (fameo-backend.conf → 127.0.0.1:8000).
# TLS certificates: certbot --nginx (DEPLOYMENT.md section 4).

upstream fameo_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name fameo.example.com;

    # certbot answers its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # `listen ... http2` rather than `http2 on`: works on nginx < 1.25 too.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fameo.example.com;

    ssl_certificate     /etc/letsencrypt/live/fameo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fameo.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The BFF (/api/bff*) streams uploads to the API, whose largest multer
    # limit is 500 MB; the API's own nginx site allows the same.
    client_max_body_size 500m;
    proxy_request_buffering off;

    location / {
        proxy_pass http://fameo_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # rate-limit.js counts TRUSTED_PROXY_HOPS (default 1) from the right
        # of X-Forwarded-For: this proxy sets exactly one entry.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
        proxy_send_timeout 300s;
    }
}
